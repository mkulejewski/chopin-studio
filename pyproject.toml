[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chopin-studio"
version = "0.1.0"
description = "Local-first touch piano practice workstation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "python-multipart>=0.0.18", "pypdf>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.setuptools.package-data]
chopin = ["migrations/*.sql"]
