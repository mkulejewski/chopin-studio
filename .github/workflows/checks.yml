name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web,test,quality]'
      - run: ruff check backend/chopin
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm format:check && pnpm test && pnpm build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [general, learning, sessions]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -e '.[web,test]'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - name: Isolated headless workflows
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            general) pnpm test:e2e ;;
            learning) pnpm exec playwright test --config=playwright.learning.config.ts ;;
            sessions) pnpm exec playwright test --config=playwright.sessions.config.ts ;;
          esac
